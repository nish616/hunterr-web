name: CI

# Run on every PR targeting main, and on direct pushes to main (e.g. fast-forward
# merges via the GitHub UI). Combined with branch protection (Settings → Branches
# → "Require status checks to pass before merging"), this gates merges to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel any in-flight CI for the same branch when a new commit lands.
# Saves Actions minutes during rebases / force-pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Build needs env vars to be present even if they're not actually used at
    # build time (db/index.ts throws if DATABASE_URL is missing, auth needs
    # AUTH_SECRET, etc.). These are dummy values — never set real secrets here.
    # If you need real secrets in CI later (e.g. for integration tests), use
    # the GitHub Actions secrets store and reference ${{ secrets.NAME }}.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_SECRET: "ci-only-not-a-real-secret-32-chars-min"
      ANTHROPIC_API_KEY: "sk-ant-ci-not-real"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Lint intentionally left out of the CI gate for now — there are
      # pre-existing react-hooks/set-state-in-effect errors that need a
      # small refactor to clear. Add `- run: npm run lint` here once the
      # existing warnings/errors are cleaned up.
